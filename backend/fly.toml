# fly.toml app configuration file generated for greenroom-api on 2026-06-16T11:54:54-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'greenroom-api'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'

[env]
  GREENROOM_LLM_MODEL = 'gpt-4o'
  PORT = '8000'

[[mounts]]
  source = 'gr_data'
  destination = '/app/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 50
    soft_limit = 25

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
